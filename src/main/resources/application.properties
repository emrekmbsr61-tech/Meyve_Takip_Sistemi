spring.application.name=meyvetakipsistemi

spring.datasource.url=jdbc:postgresql://localhost:5432/meyve_takip_sistemi
spring.datasource.username=postgres
spring.datasource.password=kante1967

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# E-posta dogrulama icin SMTP ayarlari.
# Gercek kullanici adi/parola burada YAZILMAZ; MAIL_USERNAME ve MAIL_PASSWORD
# ortam degiskenlerinden okunur. Bu degiskenler tanimli degilse mail gonderimi
# calisma zamaninda basarisiz olur ama uygulama acilisi engellenmez.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Plan tamamlaninca gonderilen ozet maili (sartname madde 8) acik/kapali.
# Gelistirirken her mal kabulde mail almamak icin false yapabilirsiniz;
# teslimden once TRUE olmalidir. Kayit dogrulama maili bundan etkilenmez.
meyve.mail.plan-summary.enabled=true

# JWT token imzalama anahtari (en az 256 bit / 32 karakter olmali, HS256 icin).
# Ogrenme/gelistirme ortami icin buraya sabit yazildi; canliya gecerken
# JWT_SECRET ortam degiskeninden okunacak sekilde degistirilmeli.
jwt.secret=${JWT_SECRET:meyveTakipSistemiCokGizliJwtAnahtariEnAz32Karakter}
# Token gecerlilik suresi (milisaniye) - 24 saat.
jwt.expiration-ms=86400000